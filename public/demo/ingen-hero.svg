<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Ingen hiring product homepage</title>
  <desc id="desc">A static product screenshot for the tester workspace demo.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#eeeae2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e2630"/>
      <stop offset="1" stop-color="#11161c"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#d8d2c8" stroke-width="1" opacity=".62"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#paper)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect width="1440" height="78" fill="#fffefa"/>
  <path d="M0 78H1440" stroke="#cfc8bc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#17191b">
    <text x="58" y="50" font-size="28" font-weight="800" letter-spacing="6">✳ INGEN</text>
    <text x="780" y="48" font-size="17">Product</text>
    <text x="892" y="48" font-size="17">How it works</text>
    <text x="1040" y="48" font-size="17">For recruiters</text>
    <rect x="1215" y="19" width="169" height="43" rx="21.5" fill="#181b1f"/>
    <text x="1253" y="46" font-size="15" font-weight="700" fill="#fff">Request a demo</text>
  </g>
  <g transform="translate(74 146)">
    <text y="0" font-family="monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#a74827">PROOF-FIRST HIRING</text>
    <text y="86" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="600" fill="#25231f">See what candidates</text>
    <text y="164" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="600" fill="#25231f">can do before you</text>
    <text y="242" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="600" fill="#25231f">decide.</text>
    <text y="309" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#686159">Evidence-backed technical screens that show hiring teams</text>
    <text y="339" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#686159">how someone reasons before the shortlist is locked.</text>
    <rect y="385" width="197" height="58" rx="29" fill="#1b1e21"/>
    <text x="34" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">Explore the product →</text>
    <rect x="215" y="385" width="178" height="58" rx="29" fill="#fffefa" stroke="#292622"/>
    <text x="250" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#25231f">How it works</text>
  </g>
  <g transform="translate(792 150)">
    <rect width="570" height="540" rx="26" fill="url(#panel)"/>
    <rect x="28" y="28" width="514" height="62" rx="13" fill="#2b3540"/>
    <circle cx="58" cy="59" r="8" fill="#f2764e"/>
    <text x="82" y="65" font-family="monospace" font-size="16" fill="#e8edf2">Candidate signal · Senior engineer</text>
    <rect x="28" y="118" width="246" height="183" rx="18" fill="#f5f1e8"/>
    <circle cx="91" cy="181" r="35" fill="#dbe4ee"/>
    <rect x="142" y="151" width="96" height="13" rx="6" fill="#8d99a6"/>
    <rect x="142" y="177" width="72" height="10" rx="5" fill="#bec7cf"/>
    <rect x="52" y="245" width="190" height="29" rx="14" fill="#dae9d9"/>
    <text x="80" y="265" font-family="monospace" font-size="13" fill="#365b3d">Evidence score 84</text>
    <rect x="296" y="118" width="246" height="183" rx="18" fill="#202831" stroke="#465666"/>
    <text x="324" y="155" font-family="monospace" font-size="13" fill="#9eabb7">REASONING TRACE</text>
    <rect x="324" y="179" width="174" height="9" rx="4" fill="#718191"/>
    <rect x="324" y="202" width="141" height="9" rx="4" fill="#516171"/>
    <rect x="324" y="225" width="188" height="9" rx="4" fill="#516171"/>
    <rect x="324" y="256" width="120" height="24" rx="12" fill="#ef805c"/>
    <rect x="28" y="329" width="514" height="179" rx="18" fill="#151b22" stroke="#465666"/>
    <text x="54" y="366" font-family="monospace" font-size="13" fill="#9eabb7">HIRING TEAM VIEW</text>
    <text x="54" y="410" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#fff">Proof before preference.</text>
    <text x="54" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#aab5bf">Compare reasoning, evidence and role fit in one dossier.</text>
    <rect x="54" y="466" width="170" height="25" rx="12" fill="#334252"/>
    <rect x="238" y="466" width="128" height="25" rx="12" fill="#334252"/>
  </g>
  <g transform="translate(74 770)" font-family="monospace">
    <text font-size="13" letter-spacing="2" fill="#8b8379">TRUST SIGNAL</text>
    <text y="45" font-size="29" font-weight="700" fill="#24211e">4× faster evidence review</text>
    <text x="445" font-size="13" letter-spacing="2" fill="#8b8379">HIRING OUTCOME</text>
    <text x="445" y="45" font-size="29" font-weight="700" fill="#24211e">Shortlists with context</text>
  </g>
</svg>
